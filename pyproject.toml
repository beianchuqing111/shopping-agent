[project]
name = "shopping-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "httpx>=0.27", "aiokafka>=0.12", "python-dotenv>=1.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
